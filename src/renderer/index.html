<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: blob:; img-src 'self' file: data:; media-src 'self' file: blob:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file:; script-src 'self' file: blob: 'wasm-unsafe-eval'">
<title>Сэмплотека</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-->
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="lg-brand" x1="4" y1="10" x2="60" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
        <path d="M7 20.5a4.5 4.5 0 0 1 4.5-4.5h12.2a3 3 0 0 1 2.2.95L30 21h22.5a4.5 4.5 0 0 1 4.5 4.5v22a4.5 4.5 0 0 1-4.5 4.5h-41A4.5 4.5 0 0 1 7 47.5z" fill="none" stroke="url(#lg-brand)" stroke-width="3.6" stroke-linejoin="round"/>
        <g stroke="url(#lg-brand)" stroke-width="3.6" stroke-linecap="round"><path d="M16 34v4M22.5 30v12M29 26v20M35.5 31v10M42 26.5v19M48.5 32v8"/></g>
      </svg>
      <span class="brand-text"><span class="brand-name" data-i18n="appName">Сэмплотека</span><span class="brand-by" title="CHERNOVsound">by <svg class="cs-mark" viewBox="312 432 356 216" aria-hidden="true"><path d="M476.6 483.4A80 80 0 1 0 476.6 596.6" fill="none" stroke="currentColor" stroke-width="52"/><path d="M458 545H493L505 562L520 515L540 598L563 455L580 638L598 498L612 560L624 532L634 548L640 545H662" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/></svg><b>CHERNOV</b>sound</span></span>
    </div>
    <div class="side-scroll">
      <nav class="side-group" id="nav-lib" aria-label="Библиотека" data-i18n-aria="library"></nav>
      <nav class="side-group" aria-label="Категории" data-i18n-aria="categories">
        <div class="side-label"><span data-i18n="categories">Категории</span> <button id="btn-learn" data-i18n="learn" data-i18n-title="learnTitle" title="Свои категории, выученные слова, распознавание по звуку">Обучение</button></div>
        <div id="nav-cats"></div>
      </nav>
      <nav class="side-group" aria-label="Папки" data-i18n-aria="folders">
        <div class="side-label"><span data-i18n="folders">Папки</span> <button id="btn-rescan-all" data-i18n="refresh" data-i18n-title="refreshTitle" title="Проверить все папки на новые файлы">Обновить</button></div>
        <div id="nav-folders"></div>
        <button class="add-folder" id="btn-add-folder">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span data-i18n="addFolder">Добавить папку</span>
        </button>
      </nav>
    </div>
    <div class="side-foot">
      <div class="seg lang-seg" id="lang-seg" role="group" aria-label="Язык / Language">
        <button data-lang="ru" class="on">RU</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="icon-btn" id="btn-theme" title="Тема" aria-label="Тема">
        <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.5a6.5 6.5 0 010 13z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="scan-box" id="listen-box" hidden>
      <div class="scan-row"><span data-i18n="listening">Слушаю звуки</span><b class="mono" id="listen-count"></b></div>
      <div class="meter"><i id="listen-meter"></i></div>
      <div class="scan-file" id="listen-file"></div>
    </div>
    <div class="scan-box" id="scan-box" hidden>
      <div class="scan-row"><span id="scan-title" data-i18n="scanning">Сканирую</span><b class="mono" id="scan-count"></b></div>
      <div class="meter" id="scan-meter"><i></i></div>
      <div class="scan-file" id="scan-file"></div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="demo-banner" id="demo-banner" hidden></div>
    <div class="toolbar">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Поиск" data-i18n-placeholder="searchPh" data-i18n-aria="searchAria" autocomplete="off" spellcheck="false" aria-label="Поиск по звукам">
        <span class="hint"><kbd>Ctrl</kbd><kbd>F</kbd></span>
      </label>
      <div class="filters">
        <div class="seg" id="f-type" role="group" aria-label="Тип звука" data-i18n-aria="soundType">
          <button data-v="" class="on" data-i18n="all">Все</button>
          <button data-v="oneshot" data-i18n="oneshots">Ваншоты</button>
          <button data-v="loop" data-i18n="loops">Лупы</button>
          <button data-v="long" data-i18n="longs">Длинные</button>
        </div>
        <label class="pill" id="f-bpm-pill" title="Темп, удары в минуту" data-i18n-title="bpmTitle">BPM
          <input id="f-bpm-min" type="number" min="40" max="300" placeholder="от" data-i18n-placeholder="from" data-i18n-aria="bpmFrom" aria-label="BPM от">
          <span class="sep">–</span>
          <input id="f-bpm-max" type="number" min="40" max="300" placeholder="до" data-i18n-placeholder="to" data-i18n-aria="bpmTo" aria-label="BPM до">
        </label>
        <label class="pill" id="f-key-pill"><span data-i18n="key">Тональность</span>
          <select id="f-key" aria-label="Тональность" data-i18n-aria="key"><option value="">любая</option></select>
        </label>
        <label class="pill" id="f-dur-pill"><span data-i18n="length">Длина</span>
          <select id="f-dur" aria-label="Длительность" data-i18n-aria="length">
            <option value="" data-i18n="any">любая</option>
            <option value="0-1" data-i18n="dur01">до 1 с</option>
            <option value="1-5" data-i18n="dur15">1–5 с</option>
            <option value="5-30" data-i18n="dur530">5–30 с</option>
            <option value="30-120" data-i18n="dur30120">30 с – 2 мин</option>
            <option value="120-" data-i18n="dur120">больше 2 мин</option>
          </select>
        </label>
        <span id="f-active"></span>
        <span class="spacer"></span>
        <span class="result-count" id="result-count"></span>
      </div>
    </div>
    <div class="list-head" id="list-head">
      <span></span>
      <button data-sort="name" data-i18n="colName">Название</button>
      <button data-sort="cat" class="c-cat" data-i18n="colCat">Категория</button>
      <span class="c-type" data-i18n="colType">Тип</span>
      <span class="num c-bpm"><button data-sort="bpm">BPM</button></span>
      <span class="num c-key"><button data-sort="key" data-i18n="colKey">Тон</button></span>
      <span class="num"><button data-sort="duration" data-i18n="colLen">Длина</button></span>
      <span class="c-fmt" data-i18n="colFmt">Формат</span>
      <span></span>
    </div>
    <div class="list" id="list" tabindex="0" aria-label="Список звуков" data-i18n-aria="soundList">
      <div class="list-inner" id="list-inner"></div>
      <div class="empty" id="empty" hidden></div>
    </div>
  </main>

  <footer class="player" id="player">
    <div class="p-info">
      <button class="p-play" id="p-play" disabled aria-label="Воспроизвести">
        <svg id="p-icon" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l11 6-11 6z" fill="currentColor"/></svg>
      </button>
      <div class="p-meta">
        <div class="p-name" id="p-name" data-i18n="pickSound">Выберите звук</div>
        <div class="p-cat" id="p-cat-wrap" hidden><span class="dot" id="p-dot"></span><select id="p-cat" aria-label="Категория звука" data-i18n-aria="soundCat" disabled></select></div>
      </div>
    </div>
    <div class="p-wave">
      <div class="crumbs" id="p-crumbs"></div>
      <div class="wave-box" id="wave-box">
        <canvas id="wave"></canvas>
        <div class="wave-msg" id="wave-msg" data-i18n="waveHint">Стрелки ↑ ↓ переключают звуки, пробел — пауза</div>
      </div>
      <div class="wave-time mono"><span id="t-cur">0:00.0</span><span id="t-dur"></span></div>
    </div>
    <div class="p-side">
      <dl class="facts" id="facts"></dl>
      <div class="p-actions">
        <div class="drag-out" id="drag-out" draggable="true" hidden title="Перетащите в DAW, Premiere, Reaper или папку" data-i18n-title="dragTitle">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3h1M10 3h1M5 8h1M10 8h1M5 13h1M10 13h1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span data-i18n="dragOut">Тащите в DAW</span>
        </div>
        <div class="p-actions-row">
          <button class="icon-btn" id="p-fav" title="В избранное (F)" aria-label="В избранное" data-i18n-title="favAddKey" data-i18n-aria="favAdd" disabled>
            <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.8l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L2.8 8.1l5-.7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="p-reveal" title="Показать в папке" aria-label="Показать в папке" data-i18n-title="reveal" data-i18n-aria="reveal" disabled>
            <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5h5l1.5 2h8.5v8.5h-15z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
          <label class="vol" title="Громкость" data-i18n-title="volume">
            <svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13.5 7a4 4 0 010 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость" data-i18n-aria="volume">
          </label>
        </div>
        <label class="toggle"><input type="checkbox" id="autoplay" checked> <span data-i18n="autoplay">Играть при выборе</span></label>
      </div>
    </div>
  </footer>
</div>
<dialog class="learn-dlg" id="learn-dlg" aria-labelledby="learn-title">
  <div class="dlg-head">
    <h2 id="learn-title" data-i18n="learn">Обучение</h2>
    <button class="icon-btn" id="learn-close" data-i18n-aria="close" aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div>
  <div class="dlg-body" id="learn-body"></div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<!--/APP-->
<script src="../shared/taxonomy.js"></script>
<script src="../shared/categorize.js"></script>
<script src="../shared/learn.js"></script>
<script src="../shared/audioset-map.js"></script>
<script src="i18n.js"></script>
<script src="listen.js"></script>
<script src="app.js"></script>
</body>
</html>
